<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Synapse</title>
  <meta name="theme-color" content="#2c3e50" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="connected.css" />
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">S<span>·</span></div>
      <div>
        <div class="brand-title">Synapse</div>
        <div class="brand-sub">Your clinical learning companion</div>
      </div>
    </div>

    <button id="appearanceBtn" class="btn ghost small" aria-haspopup="dialog" aria-controls="appearanceDialog">Display</button>
  </header>

  <dialog id="appearanceDialog" class="sheet-dialog" aria-labelledby="appearanceTitle">
    <div class="sheet-heading"><div><p class="eyebrow">MAKE IT YOURS</p><h2 id="appearanceTitle">Display & quiz settings</h2></div><button class="icon-btn" data-dismiss aria-label="Close display settings">✕</button></div>
    <div class="settings">
      <label class="field">
        <span>Theme</span>
        <select id="themeSelect"></select>
      </label>

      <label class="field">
        <span>Text size</span>
        <input id="fontSize" type="range" min="10" max="30" step="1" />
      </label>

      <label class="toggle" title="Randomises the order of questions for this session">
        <input id="randomToggle" type="checkbox" />
        <span class="track"><span class="thumb"></span></span>
        <span class="toggle-label" id="randomToggleLabel">Original</span>
      </label>
    </div>
    <p class="fine-print">Your display preferences stay on this device. Question order applies when starting a new quiz.</p>
  </dialog>

  <nav class="workspace-nav" aria-label="Synapse workspace">
    <button class="btn secondary small" data-view="home" aria-pressed="true">Home</button>
    <button class="btn secondary small" data-view="quiz" aria-pressed="false">Paste/upload</button>
    <button class="btn secondary small" data-view="packs" aria-pressed="false">My question packs</button>
    <button class="btn secondary small" data-view="progress" aria-pressed="false">UKMLA progress</button>
    <button class="btn secondary small" data-view="sources" aria-pressed="false">Sources</button>
    <button class="btn secondary small" data-view="study" aria-pressed="false">Study plan</button>
    <button class="btn secondary small" data-view="performance" aria-pressed="false">My weak points</button>
    <button class="btn secondary small" data-view="settings" aria-pressed="false">Connections</button>
    <button class="btn small" id="accountBtn" disabled>Sign in</button>
    <button class="btn secondary small" id="moreBtn" aria-haspopup="dialog" aria-controls="moreDialog">More</button>
  </nav>
  <div class="quiz-actions"><button class="btn ghost small" id="resumeBtn">Resume saved quiz</button><button class="btn ghost small" id="savePackBtn">Save to my account</button></div>
  <div class="connection-strip" role="status" aria-live="polite"><span id="connectionNotice"></span><span id="saveStatus"></span><span id="sheetStatus"></span></div>
  <main id="app" class="app"></main>
  <section id="workspace" class="workspace" hidden aria-label="Saved work and competency"></section>

  <dialog id="moreDialog" class="sheet-dialog" aria-labelledby="moreTitle">
    <div class="sheet-heading"><div><p class="eyebrow">YOUR STUDY SPACE</p><h2 id="moreTitle">More from Synapse</h2></div><button class="icon-btn" data-dismiss aria-label="Close menu">✕</button></div>
    <div id="moreItems" class="more-items"></div>
  </dialog>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Report</div>
        <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <textarea id="modalText" readonly aria-label="Quiz report"></textarea>
      </div>
      <div class="modal-footer">
        <button id="copyModalBtn" class="btn">Copy to clipboard</button>
        <button class="btn secondary" value="cancel">Close</button>
      </div>
    </form>
  </dialog>

  <script src="updates.js" type="module"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
